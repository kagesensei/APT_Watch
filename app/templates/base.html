<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}APT_Watch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('chat.index') }}">APT_Watch</a>
    <nav>
      <a href="{{ url_for('chat.index') }}">Chat</a>
      <div class="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle">Library &#9662;</button>
        <div class="nav-dropdown-menu">
          <a href="{{ url_for('main.index') }}">Overview</a>
          <a href="{{ url_for('main.actors') }}">Actors</a>
          <a href="{{ url_for('main.techniques') }}">Techniques</a>
          <a href="{{ url_for('main.software') }}">Software</a>
          <a href="{{ url_for('main.mitigations') }}">Mitigations</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Data from <a href="https://attack.mitre.org/" target="_blank" rel="noopener">MITRE ATT&amp;CK</a></span>
  </footer>
  <script>
    (function () {
      var dropdown = document.querySelector(".nav-dropdown");
      var toggle = document.querySelector(".nav-dropdown-toggle");
      if (!dropdown || !toggle) return;
      toggle.addEventListener("click", function (e) {
        e.stopPropagation();
        dropdown.classList.toggle("open");
      });
      document.addEventListener("click", function (e) {
        if (!dropdown.contains(e.target)) dropdown.classList.remove("open");
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
