<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}APT_Watch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('chat.index') }}">APT_Watch</a>
    <nav>
      <a href="{{ url_for('chat.index') }}">Chat</a>
      <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a href="{{ url_for('scan.index') }}">Scan</a>
      <div class="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle">Library &#9662;</button>
        <div class="nav-dropdown-menu">
          <a href="{{ url_for('main.index') }}">Overview</a>
          <a href="{{ url_for('main.actors') }}">Actors</a>
          <a href="{{ url_for('main.techniques') }}">Techniques</a>
          <a href="{{ url_for('main.software') }}">Software</a>
          <a href="{{ url_for('main.mitigations') }}">Mitigations</a>
          <a href="{{ url_for('main.cves') }}">CVEs</a>
        </div>
      </div>
      {% if current_user %}
      <div class="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle user-toggle">
          {% if current_user.picture %}<img class="user-avatar" src="{{ current_user.picture }}" alt="">{% endif %}
          {{ current_user.name or current_user.email }}
        </button>
        <div class="nav-dropdown-menu">
          <a href="{{ url_for('auth.logout') }}">Sign out</a>
        </div>
      </div>
      {% elif google_login_available %}
      <a href="{{ url_for('auth.login_google') }}">Sign in with Google</a>
      {% endif %}
    </nav>
  </header>
  <main class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Data from <a href="https://attack.mitre.org/" target="_blank" rel="noopener">MITRE ATT&amp;CK</a></span>
  </footer>
  <script>
    (function () {
      var dropdowns = document.querySelectorAll(".nav-dropdown");
      dropdowns.forEach(function (dropdown) {
        var toggle = dropdown.querySelector(".nav-dropdown-toggle");
        if (!toggle) return;
        toggle.addEventListener("click", function (e) {
          e.stopPropagation();
          var wasOpen = dropdown.classList.contains("open");
          dropdowns.forEach(function (d) { d.classList.remove("open"); });
          if (!wasOpen) dropdown.classList.add("open");
        });
      });
      document.addEventListener("click", function (e) {
        dropdowns.forEach(function (dropdown) {
          if (!dropdown.contains(e.target)) dropdown.classList.remove("open");
        });
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
